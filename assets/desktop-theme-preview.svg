<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Signal and Noise desktop theme preview">
  <!-- Desk ground: void, with a hint of the galaxy the owner keeps. -->
  <rect width="320" height="200" fill="#0a0a0a"/>
  <circle cx="38" cy="34" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="286" cy="22" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="252" cy="58" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="70" cy="160" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="304" cy="140" r="1" fill="#ffffff" opacity="0.4"/>
  <!-- A window: asphalt body, void titlebar, mono title, red activity dot. -->
  <g>
    <rect x="24" y="30" width="182" height="118" rx="8" fill="#171717" stroke="#383838"/>
    <rect x="24" y="30" width="182" height="24" rx="8" fill="#000000"/>
    <rect x="24" y="46" width="182" height="8" fill="#000000"/>
    <circle cx="38" cy="42" r="3" fill="#ff4c47"/>
    <text x="50" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#ffffff" letter-spacing="1">SIGNAL &amp; NOISE</text>
    <text x="38" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#9e9e9e">8/8 checks passed</text>
    <rect x="38" y="88" width="120" height="6" fill="#0a0a0a"/>
    <rect x="38" y="88" width="84" height="6" fill="#ff4c47"/>
    <text x="38" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#9e9e9e">35 of 35 anchored</text>
    <text x="38" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#ff6b66">Open Dashboard &#8594;</text>
  </g>
  <!-- A widget card + a red window-link spline reaching it. -->
  <path d="M 206 90 C 240 90, 236 64, 258 60" fill="none" stroke="#ff4c47" stroke-width="1.5" opacity="0.8"/>
  <g>
    <rect x="224" y="44" width="72" height="52" rx="8" fill="#171717" stroke="#383838"/>
    <text x="234" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#ffffff">01:15 AM</text>
    <text x="234" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#9e9e9e">Thu, Aug 27</text>
  </g>
  <!-- The dock: void slab, red divider, mono-sized nubs. -->
  <rect x="86" y="168" width="148" height="18" rx="9" fill="#0a0a0a" stroke="#383838"/>
  <circle cx="104" cy="177" r="4" fill="#9e9e9e"/>
  <circle cx="122" cy="177" r="4" fill="#9e9e9e"/>
  <rect x="138" y="171" width="1.5" height="12" fill="#ff4c47"/>
  <circle cx="156" cy="177" r="4" fill="#9e9e9e"/>
  <circle cx="174" cy="177" r="4" fill="#ffffff"/>
</svg>

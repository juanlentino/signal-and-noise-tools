name: PHPStan

# Static analysis gate — the DETERMINISTIC unknown-symbol check.
#
# Complements the local php-lsp/Intelephense (non-deterministic across editor
# state + warm/cold caches) by making the same check a hard CI signal. Catches
# the exact fatal class that took single-notes down in the theme's v9.11.2: a
# typo'd core call like get_the_queried_object_id() (the real symbol is
# get_queried_object_id()) resolves to nothing and errors HERE, in CI, before it
# can fatal in production.
#
# The committed baseline is established, so findings are a hard CI failure.
# This is the code gate's sibling — deployment stays manual (deploy.yml).
#
# Runs on PHP 8.5 to match production (Cloudways: PHP 8.5 / WordPress 7.0.x) so
# analysis reflects the deployed runtime.
#
# All analysis tooling (phpstan, php-stubs/wordpress-stubs, the phpstan-wordpress
# extension, roave/security-advisories) is composer require-dev ONLY: vendor/ is
# gitignored and never reaches the shipped plugin archive — zero runtime deps,
# no build step preserved.
#
# Security: no untrusted github.event.* interpolation; pinned action SHAs;
# least-privilege token (contents: read); credentials not persisted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      # No committed composer.lock (gitignored: dev-only linters/analysers that
      # never ship). `composer install` with no lock resolves + installs the
      # require-dev tree — and roave/security-advisories hard-fails here if any
      # resolved dev dep carries a known CVE (guards the analysis toolchain).
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      # `composer run phpstan` carries --memory-limit=1G (the 5 MB WordPress stub
      # set overflows PHP's 128M default). --error-format=github renders findings
      # as inline PR annotations.
      - name: Run PHPStan (level 1, baselined)
        run: composer run phpstan -- --no-progress --error-format=github
name: Plugin Check

# The official WordPress Plugin Check (wordpress/plugin-check-action, Apache-2.0;
# the plugin-check tool itself is GPL-2.0). A deterministic, WP-idiomatic lint —
# the same rule engine the wp.org review bot runs — that catches escaping/output,
# i18n, security, and forbidden/discouraged-function issues with zero LLM variance.
# It runs at PR time, BEFORE the expensive Opus CMA audit, and complements the
# LLM claude-review + security-review workflows with rule-based signal.
#
# Consumed via the GitHub Action / WP-CLI in CI ONLY — nothing ships; this is not
# a plugin runtime dependency. Scope is the plugin repo (the theme would need
# theme-check separately, out of scope here).
#
# WHY THE FILTER: this plugin is NOT distributed on wordpress.org (self-hosted,
# delivered by the in-plugin self-updater), so the submission-only checks are pure
# noise. We whitelist only `general` + `security`, which drops the entire
# `plugin_repo` category wholesale (readme.txt header, trademarks, updater /
# Update-URI, hello-dolly). The two submission checks that ALSO live under
# `general` — file_type (VCS/hidden-file flags) and plugin_header_fields ("Tested
# up to" / readme-header nags) — are then dropped by slug. What's KEPT is exactly
# what matters here: i18n_usage (general) plus late_escaping and the
# plugin_review_phpcs security sweep (nonce / sanitize / escape output +
# discouraged/forbidden functions) from `security`.
#
# REQUIRED / BLOCKING (promoted from the #172 gauge cycle): the gauge run measured
# the tuned ruleset, and #180 cleared all 328 ERROR-level findings (288 i18n
# text-domain, 16 escaping, 12 SQL-parameter, 12 translators-comment), so this is
# now a required check — `continue-on-error` is gone and any ERROR fails the PR.
# Advisory WARNINGs are silenced (`ignore-warnings`): the 136
# WordPress.DB.DirectDatabaseQuery.* hits are idiomatic for the plugin's custom
# analytics tables (direct $wpdb by design, no object-cache layer), so only
# genuine ERRORs gate. To actually BLOCK merge, add "WordPress Plugin Check" to
# the branch-protection required checks in repo Settings.
#
# ALWAYS-RUN (no `paths:` filter): a path-filtered job that is *also* a required
# status check deadlocks any PR that doesn't touch the filtered paths (the check
# never reports → merge stays blocked on a pending check). This repo gets exactly
# those PRs (Dependabot bumps to other workflow files, CHANGELOG-only edits), so
# the gate runs on every PR. It is cheap (~2 min), deterministic, and uses no
# secrets (default GITHUB_TOKEN), so it is safe on fork PRs and needs no fork-guard.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The action spins up a real wp-env, activates this plugin, and runs
      # `wp plugin check` against it. build-dir defaults to './', so the plugin
      # slug resolves to the repo dir (signal-and-noise-tools), matching the
      # signal-and-noise-tools.php main file.
      - name: Run Plugin Check (wp.org-submission categories filtered out)
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          # Whitelist the meaningful categories. This opt-in drops the whole
          # `plugin_repo` (wp.org submission) category and stays correct even if
          # WordPress adds new submission checks upstream.
          categories: |
            general
            security
          # Submission checks that are dual-tagged into `general` — drop by slug.
          exclude-checks: |
            file_type
            plugin_header_fields
          # Dev/test trees that are not shipped runtime code (mirrors
          # security-review.yml's exclusions). tests/ is standalone fixtures that
          # stub WP functions and would emit irrelevant escaping/function findings.
          # tools/ is owner-run `wp eval-file` CLI (raw echo, not HTML) and is
          # export-ignored via .gitattributes — never present in the shipped zip.
          exclude-directories: |
            vendor
            node_modules
            tests
            tools
          # phpstan-bootstrap.php is dev-only PHPStan tooling (referenced by
          # phpstan.neon `bootstrapFiles`, NEVER loaded by WordPress). Its whole
          # job is `defined('ABSPATH') || define('ABSPATH', '/')`, so the
          # missing_direct_file_access_protection guard the check wants would make
          # it exit before defining constants and break the PHPStan gate. Not
          # shipped runtime code — exclude it from the scan entirely.
          exclude-files: |
            phpstan-bootstrap.php
          # Advisory warnings do not gate a merge. The 136
          # WordPress.DB.DirectDatabaseQuery.* WARNINGs are idiomatic for the
          # plugin's custom analytics tables; only ERROR-level findings should
          # fail the now-required check.
          ignore-warnings: 'true'

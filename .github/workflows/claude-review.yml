name: Claude Review
on:
  pull_request:
    paths:
      - 'inc/**.php'
      - '**/render.php'
      - 'signal-and-noise-tools.php'
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      id-token: write   # claude-code-action requests an OIDC token; without this the job fails before reviewing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat .github/claude-review-prompt.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 90

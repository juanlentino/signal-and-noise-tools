name: Claude Review
on:
  pull_request:
    paths:
      - 'inc/**.php'
      - '**/render.php'
      - 'signal-and-noise-tools.php'
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # MEASURED 2026-08-19 over the last 20 successful runs, via the per-job API
    # (started_at/completed_at; the /timing endpoint returns total_ms 0 on this
    # account and reports every run as free):
    #
    #   fastest 0m55s · slowest 5m44s · mean ~3m28s · every run under 6 minutes
    #
    # 15 is 2.6x the observed maximum. The headroom is deliberate — this job's
    # duration scales with the size of the diff, so a large PR can legitimately
    # run longer than anything in that sample, and a false timeout costs a
    # re-run of the whole job.
    #
    # It was 30, set with no data.
    #
    # CORRECTION (same day): the first version of this comment justified the cut
    # as a billing saving — "30 was 1% of the monthly 3,000-minute pool per
    # hang". That is WRONG for this repo. signal-and-noise-tools is PUBLIC, and
    # GitHub-hosted standard runners are free on public repos on every plan, so
    # a hang here costs no minutes at all. The 3,000-minute pool is real, but it
    # is spent by the account's PRIVATE repos.
    #
    # The cut still stands on its own merits: a stuck review job holds a runner
    # and leaves the PR's checks unresolved for half an hour, and a timeout is a
    # ceiling on that wait. Do not raise it without measuring again.
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
      id-token: write   # claude-code-action requests an OIDC token; without this the job fails before reviewing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat .github/claude-review-prompt.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompt.outputs.content }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 90
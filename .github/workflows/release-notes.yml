name: Release Notes
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)draft notes for, e.g. v9.15.2'
        required: true
permissions: {}
jobs:
  draft:
    runs-on: ubuntu-latest
    # 10, not 30: there is no API call left to wait on (see the compose step).
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Extract CHANGELOG entry
        id: extract
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ENTRY=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {f=1; print; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md)
          if [ -z "$ENTRY" ]; then
            echo "::error::No CHANGELOG entry for $VERSION"; exit 1
          fi
          {
            echo 'entry<<CHANGELOG_EOF'
            printf '%s\n' "$ENTRY"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      # DETERMINISTIC since 2026-08-12; the AI drafter is gone, on the owner's
      # call. Three reasons, in order of weight:
      #   1. The CHANGELOG entry is the reviewed, durable record of a release.
      #      The drafter produced an UNREVIEWED paraphrase of it, and once
      #      (v10.92.4) invented a wrong causal story - it credited the wrong
      #      rule for a fix - which is exactly how a load-bearing check gets
      #      "simplified" away by a later reader trusting the notes.
      #   2. Sixty lines of retry/backoff/529 machinery existed here purely to
      #      keep the API call alive (a 529 once cost a release its draft
      #      outright). A step with no remote call needs none of it.
      #   3. Tokens cost money on every tag, across two repos, for prose that
      #      duplicated a document one directory up.
      # The notes are now two sentences plus the entry VERBATIM: what the
      # reviewer approved is what the release says.
      - name: Compose notes from the CHANGELOG entry (deterministic, no AI)
        env:
          ENTRY: ${{ steps.extract.outputs.entry }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FIRST=$(printf '%s\n' "$ENTRY" | head -n1)
          case "$FIRST" in
            *"— "*) HEADLINE="${FIRST#*— }" ;;
            *)      HEADLINE="${FIRST#\#\# }" ;;
          esac
          {
            printf '**%s**\n\n' "${HEADLINE:-$TAG}"
            printf 'The reviewed CHANGELOG entry is the record of this release, reproduced verbatim below. Nothing here was re-drafted.\n\n---\n\n'
            printf '%s\n' "$ENTRY"
          } > notes.md
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md
          fi

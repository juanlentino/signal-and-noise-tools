name: Cron orphan cleanup

# Removes scheduled-but-no-handler WP-Cron entries left over from
# uninstalled plugins. Reusable tool, not a one-off — as plugins
# come and go on the site, orphans accumulate and need pruning.
#
# **Default is DRY-RUN.** First execution lists what WOULD be deleted;
# trigger again with dry_run=false to actually delete. Idempotent —
# running twice with dry_run=false is a no-op the second time because
# each `wp cron event delete` only acts on existing events.
#
# Trigger from the Actions UI or via:
#   gh workflow run cron-orphan-cleanup.yml --repo juanlentino/signal-and-noise-tools \
#     -f dry_run=false
#
# Runs as the same app-scoped sn-plugin SSH user as deploy.yml.
# Blast radius is bounded to the WP app's cron state.
#
# Security note: inputs reach the runner through env:, never interpolated
# into the script. ssh joins its arguments into one string that the REMOTE
# shell parses again, so the runner refuses any `hooks` value that is not
# hook names (letters, digits, underscores) separated by commas, and strips
# the spaces, before ssh sees it. The remote side checks each name again and
# hands it to PHP through the environment, not inside the code. A hook with
# a live handler is never deleted, and neither is one whose handler check
# could not run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list orphans, do not delete)'
        type: boolean
        default: true
      hooks:
        description: 'Comma-separated hook names (leave blank for the documented list)'
        type: string
        default: ''

concurrency:
  group: cron-orphan-cleanup
  cancel-in-progress: false

# Least privilege: this workflow never touches the GitHub API or the repo —
# it configures SSH from secrets and runs wp-cli on the remote host. It does
# not even check out the code, so the GITHUB_TOKEN needs NO scopes at all.
permissions: {}

jobs:
  cleanup:
    name: SSH wp-cli cron event delete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH for Cloudways
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Cleanup orphan cron events
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
          HOOKS_INPUT: ${{ inputs.hooks }}
        run: |
          set -euo pipefail
          case "$DRY_RUN" in true|false) ;; *) echo "ERROR: dry_run must be true or false"; exit 1 ;; esac
          HOOKS_INPUT="${HOOKS_INPUT// /}"
          HOOKS_INPUT="${HOOKS_INPUT:+$HOOKS_INPUT,}"   # a blank value stays blank (the documented list); a given one never reads as blank
          if [[ ! "$HOOKS_INPUT" =~ ^[A-Za-z0-9_,]*$ ]]; then
            echo "ERROR: hooks takes hook names (letters, digits, underscores) separated by commas"
            exit 1
          fi
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$DRY_RUN" "$HOOKS_INPUT" <<'REMOTE'
          set -eo pipefail
          # Note: -u (nounset) is NOT enabled here because positional $2
          # may legitimately be empty (no custom hooks supplied) and
          # bash 4.x raises "unbound variable" on `"$2"` reference before
          # the safer ${2:-} expansion runs in some configurations.
          DRY_RUN="${1:-true}"
          HOOKS_INPUT="${2:-}"

          DEFAULT_ORPHANS=(
            koko_analytics_send_traffic_spike_notification
            koko_analytics_send_email_reports
            wp_statistics_record_daily_summary
            wp_statistics_dbmaint_hook
            wp_statistics_daily_cron_hook
            wp_statistics_check_licenses_status
            jetpack_clean_nonces
            jetpack_v2_heartbeat
            jp_purge_transients_cron
            ai1wm_storage_cleanup
            wpcomsh_translation_update
            updraftplus_clean_temporary_files
            regenerate_json_links_daily
            grunion_scheduled_delete
            trp_plugin_optin_sync
          )

          if [ -n "$HOOKS_INPUT" ]; then
            IFS=',' read -ra ORPHANS <<<"$HOOKS_INPUT"
            for i in "${!ORPHANS[@]}"; do
              ORPHANS[$i]="$(echo "${ORPHANS[$i]}" | xargs)"
            done
          else
            ORPHANS=("${DEFAULT_ORPHANS[@]}")
          fi

          WP_CLI=""
          if command -v wp >/dev/null 2>&1; then
            WP_CLI="wp"
          elif [ -x /usr/local/bin/wp ]; then
            WP_CLI="/usr/local/bin/wp"
          elif [ -x /usr/bin/wp ]; then
            WP_CLI="/usr/bin/wp"
          else
            echo "ERROR: wp-cli not found in PATH, /usr/local/bin, or /usr/bin"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "Using wp-cli: $WP_CLI ($("$WP_CLI" --version 2>&1 | head -1))"

          WP_ROOT=$(ls -d /home/master/applications/*/public_html 2>/dev/null | head -1)
          [ -z "$WP_ROOT" ] && { echo "ERROR: WP root not found"; exit 1; }
          cd "$WP_ROOT"
          echo "WP root: $WP_ROOT"
          echo ""

          MODE="DRY-RUN"
          [ "$DRY_RUN" = "false" ] && MODE="APPLY"
          echo "Mode: $MODE"
          echo "Candidates: ${#ORPHANS[@]} hook(s)"
          echo ""

          TOTAL_BEFORE=$("$WP_CLI" cron event list --format=count 2>/dev/null || echo 0)
          echo "Total cron events before: $TOTAL_BEFORE"
          echo ""

          DELETED=0
          ABSENT=0
          GUARDED=0
          for hook in "${ORPHANS[@]}"; do
            [ -z "$hook" ] && continue
            if [[ ! "$hook" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "  [GUARD]  (a name that is not a hook name was refused)"
              GUARDED=$((GUARDED + 1))
              continue
            fi
            COUNT=$("$WP_CLI" cron event list --hook="$hook" --format=count 2>/dev/null || echo 0)

            if [ "$COUNT" -eq 0 ]; then
              echo "  [SKIP]   $hook  (no events scheduled)"
              ABSENT=$((ABSENT + 1))
              continue
            fi

            HAS=$(SN_HOOK="$hook" "$WP_CLI" eval '$h = getenv( "SN_HOOK" ); echo ( is_string( $h ) && "" !== $h ) ? ( has_action( $h ) ? "1" : "0" ) : "?";' 2>/dev/null || echo "?")
            if [ "$HAS" != "0" ]; then
              echo "  [GUARD]  $hook  ($COUNT events, has_action=$HAS: REFUSING to delete)"
              GUARDED=$((GUARDED + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "  [WOULD]  $hook  ($COUNT events, has_action=false)"
            else
              echo -n "  [DELETE] $hook  ($COUNT events)... "
              if "$WP_CLI" cron event delete "$hook" >/dev/null 2>&1; then
                echo "done"
                DELETED=$((DELETED + 1))
              else
                echo "failed (continuing)"
              fi
            fi
          done

          echo ""
          TOTAL_AFTER=$("$WP_CLI" cron event list --format=count 2>/dev/null || echo 0)
          echo "Total cron events after:  $TOTAL_AFTER"
          echo "Delta: $((TOTAL_BEFORE - TOTAL_AFTER))"
          echo "Already absent: $ABSENT"
          echo "Guarded (live handler, unreadable check or refused name): $GUARDED"
          if [ "$DRY_RUN" = "false" ]; then
            echo "Deleted: $DELETED"
          fi
          REMOTE

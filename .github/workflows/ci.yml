name: CI

# Code-quality gate for pull requests + pushes to main. Four jobs:
#   1. lint      — PHP syntax check (php -l) across all non-vendor files.
#   2. phpcs     — WordPress-Coding-Standards via the committed phpcs.xml.dist
#                  (catches escaping/unslash/deprecated-API issues php -l can't).
#   3. tests     — the standalone tests/*.php fixture sweep (no WP/DB needed).
#   4. changelog — on PRs, fail if the plugin Version: bumped without a matching
#                  CHANGELOG.md entry (the gap that shipped v4.5.2 changelog-less).
#   5. cron-liveness — is the SCHEDULED parity workflow still firing? A cron
#                  cannot witness its own absence, so the guard rides a
#                  different trigger. Its own job, and its own failure row,
#                  because it answers a different question from the others.
#
# This is the code gate. Deployment is manual via the WP self-updater
# (deploy.yml, workflow_dispatch only) — CI passing does NOT deploy.
#
# Security: only hardcoded values in run: steps; untrusted github.event.*
# fields (base.ref) are passed via env: and quoted, never interpolated into
# shell — no command-injection surface.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    # Measured max over the last 8 successful runs: 56s. Set above that with real headroom, not at it.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Lint all .php files
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" > /dev/null; then
              echo "::error file=$f::PHP parse error"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*')
          exit $fail

      # Rides the lint job rather than taking its own. NOT for billing: this
      # repo is PUBLIC, and standard runners are free on public repos on any
      # plan — the per-job rounding argument that shaped this file elsewhere
      # simply does not apply here. It rides along because a separate job pays
      # checkout + setup again for a check that takes well under a second, and
      # adds another row to the PR's status list for no signal.
      - name: Every job declares a timeout
        run: |
          # A job with no `timeout-minutes` silently inherits GitHubs default
          # of SIX HOURS. On this PUBLIC repo that costs no MONEY — standard
          # runners are free on public repos — but it holds a runner and leaves
          # the PR's checks unresolved for the whole six hours, which is the
          # real damage. Neither actionlint nor zizmor enforces this
          # (actionlint#49, zizmor#1023 are both still open), so it is here.
          #
          # YAML-aware on purpose. The first version of this counted lines with
          # grep and reported 28 jobs against 12 real ones, because `^  \w+:$`
          # also matches push:, pull_request:, contents: and every other
          # two-space key. Ruby ships on ubuntu-latest, so psych costs nothing.
          ruby -ryaml -e '
            bad = []; total = 0
            Dir[".github/workflows/*.yml"].sort.each do |f|
              d = YAML.load_file(f)
              (d["jobs"] || {}).each do |name, job|
                total += 1
                bad << "#{f}: job (#{name})" unless job.is_a?(Hash) && job["timeout-minutes"]
              end
            end
            # The guard guards ITSELF: zero jobs found means the glob or the
            # parse broke, and a silent 0 == 0 would pass while checking nothing.
            # NOTE: keep this ruby source ASCII-only. `ruby -e` defaults to
            # US-ASCII, so a stray em dash here aborts the step on EVERY run,
            # identically on a clean tree and a broken one.
            if total.zero?
              puts "::error::no jobs found - this check is not checking anything"
              exit 1
            end
            unless bad.empty?
              bad.each { |b| puts "::error::#{b} declares no timeout-minutes (inherits a 6-hour default)" }
              puts "#{bad.size} of #{total} job(s) missing timeout-minutes"
              exit 1
            end
            puts "#{total} job(s) across #{Dir[".github/workflows/*.yml"].length} workflows, every one declares a timeout"
          '

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    # Measured max over the last 8 successful runs: 27s. Set above that with real headroom, not at it.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      # Install only the dev tooling (PHPCS + WPCS + PHPCompatibilityWP) declared
      # in composer.json require-dev. The phpcodesniffer-composer-installer plugin
      # auto-wires the WordPress + PHPCompatibilityWP standards into vendor/bin/phpcs.
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPCS (curated WP-handbook ruleset)
        run: composer run lint

      - name: Stub-parity self-test (negative control)
        # Prove the instrument can FAIL before trusting a green sweep: it seeds
        # a phantom API and a by-reference drift and must report both. The
        # by-ref check shipped INERT in the first draft (PHP 8 tokenizes a
        # parameter's & as a token array, not the string '&') and this control
        # is what caught it.
        run: php tools/stub-parity.php --self-test
      - name: Stub-parity sweep (test stubs vs the pinned WordPress stubs)
        # Same php-stubs/wordpress-stubs PHPStan already trusts. Fails on a
        # WP-shaped stub core does not have that production calls UNGUARDED
        # (the get_the_queried_object_id incident class), and on by-reference
        # drift. Guarded forward-compat calls are reported as notes, not
        # failures. Runs here because this job already did composer install —
        # a separate job would round up a whole extra billed minute.
        run: php tools/stub-parity.php
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    # Measured max over the last 8 successful runs: 40s. Set above that with real headroom, not at it.
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      # The host's rewrite pins run WordPress's own HTML API
      # (WP_HTML_Tag_Processor), which a standalone sweep has no WordPress to
      # load. Fetch the seven files from the core mirror at the version the
      # sandbox runs and point the suites at them; tests/openstation-host.php
      # FAILS under CI when the API is absent, so a broken fetch is loud rather
      # than a green skip.
      - name: Fetch WordPress's HTML API for the host rewrite pins
        run: |
          set -e
          base="https://raw.githubusercontent.com/WordPress/wordpress-develop/7.1/src/wp-includes"
          dest="$RUNNER_TEMP/wp-includes"
          mkdir -p "$dest/html-api"
          for f in class-wp-html-tag-processor.php class-wp-html-attribute-token.php class-wp-html-span.php class-wp-html-text-replacement.php class-wp-html-decoder.php html5-named-character-references.php; do
            curl -sSfL "$base/html-api/$f" -o "$dest/html-api/$f"
          done
          curl -sSfL "$base/class-wp-token-map.php" -o "$dest/class-wp-token-map.php"
          echo "SNT_WP_HTML_API=$dest/html-api" >> "$GITHUB_ENV"
      # Standalone fixture tests — each stubs its own WP functions, so no WP
      # install or DB is needed. contracts-smoke.php is EXCLUDED: it requires a
      # live WP env (wp-load.php) and is a manual `wp eval-file` run only — in CI
      # it would no-op with "ABSPATH not set" and assert nothing (a false green).
      - name: Run standalone test sweep
        # The sweep logic lives in tests/run.sh, committed, so a local sweep and
        # CI apply the SAME gate. It used to be inline here, which meant anyone
        # sweeping by hand wrote their own — and on 2026-08-11 a hand-rolled one
        # counted two fatally-crashed suites as green, because a dead suite emits
        # no summary line to fail on. The script's header tells that story.
        run: bash tests/run.sh
      - name: Parse the app client (a no-build script; a syntax error would otherwise ship green)
        run: node --check apps/signal-noise/signal-noise-client.js
      # tests/lib/ is NOT swept: tests/run.sh globs tests/*.php non-recursively,
      # so a helper living there runs only through the suites that require it.
      # Its own contract needs its own gate - the same shape
      # tools/stub-parity.php --self-test already uses.
      #
      # What it proves: the helper REJECTS the v13.95.1 envelope (a refusal that
      # read as a benign success) and ACCEPTS the corrected one. A helper that
      # accepted both would be an assertion-shaped no-op wired into four suites.
      #
      # Only on this job, not php-matrix: the helper is pure PHP with no
      # version-dependent behaviour, so running it per matrix lane would bill
      # the same proof several times over.
      - name: Envelope assertion helper self-test
        run: php tests/lib/assert-envelope.php --self-test

  php-matrix:
    name: PHP ${{ matrix.php }} — ${{ matrix.label }}
    runs-on: ubuntu-latest
    # The blocking lanes measure ~50s (setup + lint + sweep). The nightly lane
    # can be slower because setup-php builds from master; headroom, not a cap
    # set at the observed mean.
    timeout-minutes: 8
    strategy:
      # Independent lanes: a nightly break must not cancel the lane that tests
      # what production actually runs.
      fail-fast: false
      matrix:
        include:
          # PRODUCTION PARITY. The live server runs PHP 8.4 (Cloudways package
          # version, read 2026-08-27) while every other job in this file pins
          # 8.3 — so until this lane existed, CI had never once exercised the
          # version the site actually serves on. Blocking, deliberately.
          - php: '8.4'
            label: 'production parity (Cloudways)'
            experimental: false
          # CURRENT STABLE UPSTREAM — READINESS, not parity. The host does not
          # offer 8.5 yet (owner-confirmed 2026-08-27), so nothing here can
          # deploy to it; this lane exists because an incompatibility is
          # cheapest to fix the day it is written, and because 8.3 left ACTIVE
          # support on 2025-12-31, making "we test 8.3" a statement about the
          # past. Blocking only because it was MEASURED first: both suites run
          # clean on a local 8.5.9. If it ever reds for a version the site
          # cannot run, demote it by giving its steps the nightly lane's
          # step-level continue-on-error rather than arguing with the red.
          - php: '8.5'
            label: 'current stable (readiness)'
            experimental: false
          # THE ACTUAL NEXT: setup-php resolves 8.6 to a nightly 8.6.0-dev
          # build from master. Upstream is a moving target, so every step in
          # this lane is non-blocking — and that is STEP-level on purpose:
          # job-level continue-on-error still reports the check-run as failed
          # and reds the PR, which trips the never-merge-a-red-PR rule.
          - php: '8.6'
            label: 'nightly, non-blocking'
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php }}
        # Non-blocking on the nightly lane too: a master build that fails to
        # install must not red the PR, and the steps below stay guarded.
        continue-on-error: ${{ matrix.experimental }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint all .php files
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! php -l "$f" > /dev/null; then
              echo "::error file=$f::PHP parse error on PHP ${{ matrix.php }}"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*')
          exit $fail
      # The host's rewrite pins run WordPress's own HTML API
      # (WP_HTML_Tag_Processor), which a standalone sweep has no WordPress to
      # load. Fetch the seven files from the core mirror at the version the
      # sandbox runs and point the suites at them; tests/openstation-host.php
      # FAILS under CI when the API is absent, so a broken fetch is loud rather
      # than a green skip.
      - name: Fetch WordPress's HTML API for the host rewrite pins
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -e
          base="https://raw.githubusercontent.com/WordPress/wordpress-develop/7.1/src/wp-includes"
          dest="$RUNNER_TEMP/wp-includes"
          mkdir -p "$dest/html-api"
          for f in class-wp-html-tag-processor.php class-wp-html-attribute-token.php class-wp-html-span.php class-wp-html-text-replacement.php class-wp-html-decoder.php html5-named-character-references.php; do
            curl -sSfL "$base/html-api/$f" -o "$dest/html-api/$f"
          done
          curl -sSfL "$base/class-wp-token-map.php" -o "$dest/class-wp-token-map.php"
          echo "SNT_WP_HTML_API=$dest/html-api" >> "$GITHUB_ENV"
      - name: Run standalone test sweep
        continue-on-error: ${{ matrix.experimental }}
        # The same committed tests/run.sh every other sweep uses, so a lane
        # cannot drift into its own weaker gate. Deprecations matter MORE here
        # than in production: the live server runs
        # `error_reporting = E_ALL & ~E_DEPRECATED`, so a deprecation notice is
        # invisible there and CI is the only place it can surface.
        run: bash tests/run.sh

  changelog:
    name: CHANGELOG entry present
    runs-on: ubuntu-latest
    # Measured max over the last 8 successful runs: 10s. Set above that with real headroom, not at it.
    timeout-minutes: 3
    # Only meaningful on PRs (compares against the base branch). Two rules, both
    # in this ONE job — originally to share a rounded-up billed minute, which
    # does not apply on a public repo; they stay together because they answer
    # one question and one failure row is easier to read than two.
    #
    #   1. A version bump needs a matching '## [x.y.z]' entry — the gap that
    #      shipped the v4.5.2 release changelog-less (an editor no-op).
    #   2. Shippable code changing WITHOUT a version bump needs SOME addition to
    #      CHANGELOG.md.
    #
    # Rule 2 exists because rule 1 alone exempts almost everything. Releases here
    # bump the version at release time, not per PR, so head_ver = base_ver on
    # essentially every feature PR and rule 1 exits 0 without reading CHANGELOG.md
    # at all. Caught 2026-08-15: PR #677 shipped the provenance settle window and
    # rule 1 reported "Version unchanged - CHANGELOG entry not required". The
    # entry was written by hand during review; nothing would have required it.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require CHANGELOG entry when Version bumps
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          # Read the plugin Version: from the docblock on both the PR head and base.
          head_ver=$(grep -m1 -E '^\s*\*\s*Version:' signal-and-noise-tools.php | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          base_ver=$(git show "origin/${BASE_REF}:signal-and-noise-tools.php" 2>/dev/null | grep -m1 -E '^\s*\*\s*Version:' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          echo "base version: ${base_ver:-(unknown)}  ->  head version: ${head_ver:-(unknown)}"
          if [ -z "$head_ver" ]; then
            echo "::error::could not parse Version: from signal-and-noise-tools.php"
            exit 1
          fi
          if [ "$head_ver" = "$base_ver" ]; then
            echo "Version unchanged - CHANGELOG entry not required."
            exit 0
          fi
          # Version changed: a matching '## [x.y.z]' header must exist in CHANGELOG.md.
          if grep -qE "^##\s*\[${head_ver}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${head_ver}."
          else
            echo "::error file=CHANGELOG.md::Version bumped to ${head_ver} but no '## [${head_ver}]' entry in CHANGELOG.md. Add one (see global rule: ALWAYS update CHANGELOG.md)."
            exit 1
          fi
      # Rule 2. Shippable code changed but the version did not, so rule 1 above
      # exited 0 without reading CHANGELOG.md. Require the PR to have added a
      # line to the '## [Unreleased]' SECTION of the root CHANGELOG.md.
      #
      # v13.96-era change: the root file is now '## [Unreleased]' plus the
      # current cut only; everything older lives in docs/changelog/. The
      # previous test counted added lines anywhere in the root file, which an
      # edit to the current-cut section satisfied without documenting anything
      # new. It also would have been satisfied by nothing at all once history
      # moved, since archive edits do not touch this file.
      #
      # "Added lines", not merely "file changed": a deletion-only edit or a mode
      # change satisfies the weaker test while documenting nothing. It does NOT
      # claim to detect a reflow — re-wrapping a paragraph does add lines, and
      # this gate would accept it. The bar is deliberately low; its job is to
      # stop a PR shipping with the CHANGELOG untouched, not to judge prose.
      #
      # Scope is what reaches a reader's site. tests/, docs/, .github/ and
      # tooling change nothing a user experiences and are exempt, so this does
      # not tax refactors of the test suite.
      #
      # Escape hatch is the 'no-changelog' LABEL, evaluated by Actions rather
      # than the shell — a label cannot inject into `run:` the way a title or a
      # commit message can.
      - name: Require a CHANGELOG addition when shippable code changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -e
          base="origin/${BASE_REF}"

          head_ver=$(grep -m1 -E '^\s*\*\s*Version:' signal-and-noise-tools.php | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          base_ver=$(git show "${base}:signal-and-noise-tools.php" 2>/dev/null | grep -m1 -E '^\s*\*\s*Version:' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          if [ "$head_ver" != "$base_ver" ]; then
            echo "Version bumped - rule 1 above already required the entry."
            exit 0
          fi

          shipped=$(git diff --name-only "${base}...HEAD" \
            | grep -E '^(inc/|blocks/|assets/|signal-and-noise-tools\.php$)' || true)
          if [ -z "$shipped" ]; then
            echo "No shippable code changed - CHANGELOG addition not required."
            exit 0
          fi

          # Count non-blank lines inside the '## [Unreleased]' section only, on
          # both sides. Anywhere else in the file does not count: the current
          # cut is already released, and the archive is a different file.
          unreleased_lines() {
            awk '/^## \[Unreleased\]/ { inside = 1; next }
                 inside && /^## \[/    { exit }
                 inside                { print }' \
              | grep -c '[^[:space:]]' || true
          }

          head_unreleased=$(unreleased_lines < CHANGELOG.md)
          base_unreleased=$(git show "${base}:CHANGELOG.md" 2>/dev/null | unreleased_lines)
          head_unreleased=${head_unreleased:-0}
          base_unreleased=${base_unreleased:-0}
          echo "Unreleased section: ${base_unreleased} line(s) on base -> ${head_unreleased} on head."

          if [ "$head_unreleased" -gt "$base_unreleased" ]; then
            echo "CHANGELOG.md gained an Unreleased entry alongside shippable changes."
            exit 0
          fi

          echo "Shippable files changed by this PR:"
          printf '  %s\n' $shipped
          echo "::error file=CHANGELOG.md::This PR changes shippable code but adds nothing under '## [Unreleased]' in CHANGELOG.md. A PR does not bump Version and does not add a '## [x.y.z]' heading - it adds a bullet under Unreleased. If it genuinely needs none, apply the 'no-changelog' label."
          exit 1

  cron-liveness:
    name: Parity cron still firing
    runs-on: ubuntu-latest
    # One API-bound step. Measured: ~8s. Set with headroom, not at it — and set
    # at all, because a hung job holds a runner and leaves this PR's checks
    # unresolved for up to six hours (the argument here is runner-hold and
    # blocked-PR time; Actions minutes are FREE on this public repo).
    timeout-minutes: 3
    # Reading workflow runs needs actions:read. Scoped to THIS job rather than
    # widened at the top of the file, and deliberately READ — the check that
    # shipped in #752 and was removed in #753 failed because it needed WRITE
    # scope to see a draft release. Nothing here needs write.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTE: the JOB name above is a REQUIRED status check in this repo's
      # 'Require PR on main' ruleset, matched by exact string. Renaming it makes
      # the context unreportable and every PR permanently unmergeable, so it
      # stays as-is even though the guard now watches a list. Rename the STEP.
      - name: Have the scheduled workflows fired recently?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Retry the API, don't red on a hiccup. A flaky read reported as a
          # finding is worse than no check: it trains everyone to re-run and
          # stop reading. Three tries, then let the failure stand.
          api() {
            for i in 1 2 3; do
              if out=$(gh api "$1" --jq "$2" 2>/dev/null); then printf '%s' "$out"; return 0; fi
              sleep 5
            done
            return 1
          }
          # workflow:grace_hours. The grace states the tolerance that fits THAT
          # cron's cadence — there is no shared default and the guard refuses a
          # row without one, because a daily tolerance on an hourly cron can
          # miss twenty-two runs and still report health.
          rows=$(printf '%s\n' \
            'version-tag-parity.yml:48' \
            'editor-api-smoke.yml:48' \
            | while IFS=: read -r wf grace; do
                [ -n "$wf" ] || continue
                created=$(api "repos/${REPO}/actions/workflows/${wf}" '.created_at') || created=""
                runs=$(api "repos/${REPO}/actions/workflows/${wf}/runs?event=schedule&per_page=10" '[.workflow_runs[].created_at]') || runs="[]"
                # An empty created_at reaches the script as null, which it reports
                # as 'indeterminate' rather than passing — a blind instrument goes red.
                if [ -z "$created" ]; then created_json=null; else created_json="\"${created}\""; fi
                printf '{"name":"%s","grace_hours":%s,"workflow_created_at":%s,"scheduled_run_times":%s}\n' \
                  "$wf" "$grace" "$created_json" "${runs:-[]}"
              done | paste -sd, -)
          # An empty list is refused by the guard, not passed. That is deliberate:
          # if the loop above ever produces nothing, nothing was checked, and
          # nothing checked must never read as everything passing.
          printf '{"workflows":[%s]}' "$rows" | php tools/cron-liveness.php --check

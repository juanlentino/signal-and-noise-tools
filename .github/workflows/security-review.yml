name: Security Review
on:
  pull_request:
jobs:
  security:
    # Fork-guard: same-repo PRs only (public-repo fork PRs get no secrets anyway).
    # Dependabot PRs run without access to Actions secrets (ANTHROPIC_API_KEY
    # is empty), so this review can't run there — skip the bot's own PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 10, not 30. Measured durations of successful runs: 50s, 56s, 65s, 76s,
    # 265s — so 30 minutes was ~7x the slowest success, and the guidance is to
    # set the ceiling above the observed mean, not far above the observed max.
    #
    # On 2026-08-15 this action HUNG on PR #678 and the 30-minute ceiling held
    # the PR unmergeable for half an hour before reporting anything; a re-run of
    # the identical commit then succeeded, so the hang was infrastructure
    # flakiness rather than a finding. A 10-minute ceiling still clears the
    # slowest observed success by ~2.3x while surfacing the next hang in a third
    # of the time.
    # Measured max over the last 8 successful runs: 200s. Set above that with real headroom, not at it.
    #
    # 2026-08-24, RAISED 8 -> 15. Two new measurements broke the 200s model:
    # this repo's PR #799 ran 8m30s and was CANCELLED by the 8-minute cap
    # without producing a verdict, and the sibling theme repo's identical job
    # completed SUCCESSFULLY at 9m44s on the same day. So ~10 minutes is now a
    # real success duration, not a hang, and an 8-minute cap converts ordinary
    # slow runs into red PRs.
    #
    # This is not merely cosmetic, because of how the cancellation fails:
    # the action writes a per-SHA cache marker, and a run cancelled mid-scan
    # leaves that marker behind. Every subsequent re-run of the same SHA then
    # finds the marker, SKIPS the scan entirely
    # (`claudecode-scan; outcome=skipped; duration_ms=0`, no findings.json)
    # and reports the job GREEN in ~14 seconds. A timeout here therefore does
    # not just fail a PR -- it poisons the check into passing without ever
    # scanning, which is worse than the red it replaces. Observed twice on
    # PR #799 before the cause was found in the job log.
    #
    # Note the prose above this line already argued for a 10-minute ceiling
    # while the value read 8; that drift is resolved here too.
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-5
          comment-pr: 'true'
          run-every-commit: 'false'
          exclude-directories: 'vendor,node_modules,tests'
          # Project-specific findings this codebase has actually shipped,
          # appended to the audit prompt. Currently the sn_settings subtree
          # clobber (bitten 4x): sn_settings_save() whole-option replaces, so a
          # new subtree not re-included is silently wiped on the next save of
          # ANY tab. Inherited from the Claude Review prompt, which was disabled
          # 2026-08-15 after producing zero comments in its entire history —
          # this is the one thing it knew that the security audit did not.
          custom-security-scan-instructions: '.github/security-scan-instructions.md'
name: Deploy to Cloudways

# v1.10.1+: tag pushes no longer auto-deploy. Updates land via the
# WP admin Updates page (inc/wp-update-integration.php registers the
# plugin with WP's native update system). workflow_dispatch remains
# as a manual emergency-hotfix fallback — trigger from the GitHub
# Actions UI or via `gh workflow run deploy.yml --ref vX.Y.Z`.
on:
  workflow_dispatch:

# Serialise deploys: if a new tag fires while one is in flight, queue
# rather than cancel — never drop a release.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH git checkout + CF purge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH for Cloudways
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH git checkout on Cloudways
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Validate ref name (defense-in-depth — git already constrains
          # ref characters, but a strict pattern here prevents future
          # surprises if upstream ever loosens its rules).
          case "$TAG_REF" in
            v[0-9]*) ;;
            *) echo "ERROR: invalid tag ref: $TAG_REF"; exit 1 ;;
          esac
          # Pass TAG_REF as a positional arg to the remote bash so the
          # local shell never expands it into the heredoc body.
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$TAG_REF" <<'REMOTE'
          set -euo pipefail
          TAG_REF="$1"
          # The deploy runs as Cloudways' restricted "additional SSH user"
          # (sn-plugin → nffqxsrgxz). Their ~/.ssh is root-owned and
          # read-only, so the GitHub deploy key lives in the user-writable
          # ~/.openssh/ directory (Cloudways convention) and we point git
          # at it explicitly via GIT_SSH_COMMAND.
          export GIT_SSH_COMMAND="ssh -i $HOME/.openssh/cw-to-gh-deploy_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.openssh/known_hosts"
          # Auto-discover the plugin path — Cloudways uses random per-app
          # dir names (e.g. nffqxsrgxz). Surviving a Cloudways app
          # migration is worth one extra ls invocation.
          PLUGIN_DIR=$(ls -d /home/master/applications/*/public_html/wp-content/plugins/signal-and-noise-tools 2>/dev/null | head -1)
          [ -z "$PLUGIN_DIR" ] && { echo "ERROR: plugin dir not found"; exit 1; }
          echo "Plugin dir: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          echo "Before: $(git describe --tags --always)"
          # v2.0.3 hardening: discard any working-tree state from WP-UI
          # installs that wrote files without updating the git index.
          # Safe because plugin dir is fully reproducible from git.
          git reset --hard --quiet HEAD
          git clean -fd --quiet
          git fetch --tags --quiet
          git checkout --quiet "$TAG_REF"
          echo "After:  $(git describe --tags --always)"
          grep -E '^[[:space:]]*\*?[[:space:]]*Version:' signal-and-noise-tools.php | head -1
          REMOTE

      - name: Purge caches via WP-CLI in-process (no App Password required)
        # v3.7.3 architecture change: replaces the HTTP REST-based purge that
        # required WP_DEPLOY_USER + WP_DEPLOY_APP_PASSWORD. The actual purge
        # work (object cache + Breeze + Varnish + Cloudflare) lives in the
        # theme's `sn_purge_all_caches_result` filter at
        # inc/template-maintenance.php. We invoke it via `wp eval` over the
        # same SSH connection used by the git checkout step above — auth is
        # already established via the deploy SSH key (app-scoped sn-plugin
        # user), so no HTTP Basic Auth and no rotatable App Password is
        # involved. After v3.7.3 ships, WP_DEPLOY_USER and
        # WP_DEPLOY_APP_PASSWORD GH secrets can be deleted.
        #
        # Same continue-on-error shape as v3.7.2's HTTP version for the
        # same reason: SSH git checkout above already landed the files; a
        # missed cache purge is a latency artifact, not a deploy failure.
        # If wp-cli is unavailable or the filter fails, CF edge revalidates
        # naturally via last-modified headers on every plugin asset.
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          # Let OPcache pick up the new files written by the prior SSH step
          # (validate_timestamps gates this on Cloudways).
          sleep 5
          ssh "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          # Auto-discover the app's public_html. Cloudways uses random
          # per-app directory names (e.g. nffqxsrgxz); the sn-plugin SSH
          # user has read access only to its own app, so this glob matches
          # exactly one entry — same lookup pattern as the SSH git checkout
          # step.
          APP_PUBLIC=$(ls -d /home/master/applications/*/public_html 2>/dev/null | head -1)
          if [ -z "$APP_PUBLIC" ]; then
            echo "::warning::Could not locate app public_html for wp-cli."
            exit 1
          fi
          cd "$APP_PUBLIC"
          # Verify wp-cli is on PATH (Cloudways ships it for app-scoped
          # SSH users on all apps; explicit check survives a future
          # Cloudways base-image change).
          if ! command -v wp >/dev/null 2>&1; then
            echo "::warning::wp-cli not found on PATH for SSH_USER. CF edge will revalidate naturally."
            exit 1
          fi
          # Call SN's purge filter in-process. The theme's
          # inc/template-maintenance.php registers a filter handler that
          # purges object cache + Breeze + Varnish + Cloudflare (uses CF
          # API credentials from WP options). Returns purged count.
          count=$(wp eval 'echo (int) apply_filters("sn_purge_all_caches_result", 0, array("template_overrides" => false));' 2>&1)
          echo "Purged $count caches via sn_purge_all_caches_result filter."
          REMOTE

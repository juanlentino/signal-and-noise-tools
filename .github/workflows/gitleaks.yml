name: Gitleaks
on:
  # 2026-09-08: `push:` had no branch filter, so a same-repo branch fired BOTH
  # triggers and every PR carried two identical gitleaks checks (measured 11s +
  # 11s on #1128). Scoping the push trigger to main leaves full coverage of what
  # can actually reach main: PRs are scanned by `pull_request`, and direct pushes
  # to main are scanned here. The narrow gap left is a push to a feature branch
  # that has no PR yet — which cannot reach main without opening one.
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # Measured max over the last 8 successful runs: 12s. Set above that with real headroom, not at it.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so secrets in older commits are scanned too
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml at the repo root is auto-detected — no license needed
          # for public repos on a personal account.